name: nopDevStack
version: "3.7"
services:
    nopcommerce_web:
        build:
            context: ..
            dockerfile: ./.devcontainer/Dockerfile
        container_name: nopcommerce
        ports:
            - "80:80"
        depends_on:
            nopcommerce_database:
                condition: service_started
                required: true
        networks:
            - nop-net
        volumes:
            - type: bind
              source: ../src
              target: /workspace/src
            - type: bind
              source: ../.devcontainer
              target: /workspace/.devcontainer
            # - type: bind
            #   source: ./.vscode
            #   target: /workspace/.vscode 
        # user: vscode
    nopcommerce_database:
        image: "mcr.microsoft.com/mssql/server:2019-latest"
        container_name: nopcommerce_mssql_server
        environment:
            SA_PASSWORD: "nopCommerce_db_password"
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Express"
        networks:
            - nop-net

volumes:
  nopcommerce_data:    

networks:
  nop-net:
    driver: bridge